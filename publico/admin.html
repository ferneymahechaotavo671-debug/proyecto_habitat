<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin</title>

<style>

/* ===== RESET ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

/* ===== FONDO PRO ===== */
body {
  background: linear-gradient(135deg, #0f3d2e, #1f7a63, #38b48b);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 30px;
}

/* ===== LOGIN ===== */
#loginBox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.login-card {
  background: white;
  padding: 30px;
  border-radius: 18px;
  width: 320px;
  text-align: center;
}

.login-card input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
}

/* ===== CONTENEDOR ===== */
.container {
  background: white;
  padding: 25px;
  border-radius: 20px;
  width: 100%;
  max-width: 1100px;
  display: none;
}

/* ===== FILTROS ===== */
.filters {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
  flex-wrap: wrap;
}

select, input {
  padding: 10px;
  flex: 1;
}

button {
  padding: 10px 14px;
  background: #1f7a63;
  color: white;
  border: none;
  cursor: pointer;
}

/* ===== TABLA ===== */
table {
  width: 100%;
  border-collapse: collapse;
}

th {
  background: #1f7a63;
  color: white;
}

td, th {
  padding: 10px;
  text-align: center;
}

/* ===== MODALES ===== */
#formulario, #permisoBox, #menuBox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  justify-content: center;
  align-items: center;
}

.menu-card, .modal {
  background: white;
  padding: 20px;
  border-radius: 15px;
  width: 320px;
  text-align: center;
}

#menuBox.show {
  display: flex;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
  <div class="login-card">
    <h3>Login Admin</h3>
    <input type="password" id="pass">
    <button onclick="login()">Entrar</button>
  </div>
</div>

<!-- ADMIN -->
<div class="container">

<h2>Panel Admin</h2>

<div class="filters">

<select id="edificio"></select>
<input id="cedula" placeholder="Cédula">

<button onclick="cargar()">Filtrar</button>
<button onclick="menuAdmin()">☰ Menú</button>

</div>

<table>
<thead>
<tr>
<th>ID</th>
<th>Nombre</th>
<th>Cédula</th>
<th>Edificio</th>
<th>Rol</th>
<th>Tipo</th>
<th>Fecha</th>
<th>Obs</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

</div>

<!-- MENU -->
<div id="menuBox">
  <div class="menu-card">

    <h3>Menú</h3>

    <button onclick="mostrarFormulario(); cerrarMenu()">➕ Persona</button>
    <button onclick="mostrarFormEdificio(); cerrarMenu()">🏢 Edificio</button>
    <button onclick="abrirPermisos(); cerrarMenu()">🔐 Permisos</button>
    <button onclick="editarUsuario(); cerrarMenu()">✏️ Editar</button>
    <button onclick="eliminarRegistro(); cerrarMenu()">🗑️ Eliminar</button>
    <button onclick="dashboard(); cerrarMenu()">📊 Dashboard</button>
    <button onclick="exportarExcel(); cerrarMenu()">📥 Excel</button>

    <button onclick="cerrarMenu()">Cerrar</button>

  </div>
</div>

<!-- PERSONA -->
<div id="formulario">
  <div class="modal">
    <h3>Crear Usuario</h3>
    <input id="nombreNuevo" placeholder="Nombre">
    <input id="cedulaNueva" placeholder="Cédula">
    <input id="rolNuevo" placeholder="Rol ID">
    <select id="edificioNuevo"></select>

    <button onclick="crearUsuario()">Guardar</button>
    <button onclick="cerrarFormulario()">Cerrar</button>
  </div>
</div>

<!-- PERMISOS -->
<div id="permisoBox">
  <div class="modal">
    <h3>Permisos</h3>
    <input id="cedulaPermiso" placeholder="Cédula">
    <select id="edificioPermiso"></select>

    <button onclick="asignarPermiso()">Dar acceso</button>
    <button onclick="quitarPermiso()">Quitar</button>
    <button onclick="cerrarPermisos()">Cerrar</button>
  </div>
</div>

<script>

/* ======================
   LOGIN
====================== */
const PASSWORD = "Habitat2026";

function login(){
  const pass = document.getElementById("pass").value;

  if(pass === PASSWORD){
    document.getElementById("loginBox").style.display = "none";
    document.querySelector(".container").style.display = "block";
    loadEdificios();
    cargar();
  }
}

/* ======================
   MENU FIX
====================== */
function menuAdmin(){
  document.getElementById("menuBox").classList.add("show");
}

function cerrarMenu(){
  document.getElementById("menuBox").classList.remove("show");
}

/* ======================
   MODALES FIX
====================== */
function mostrarFormulario(){
  document.getElementById("formulario").style.display = "flex";
}

function cerrarFormulario(){
  document.getElementById("formulario").style.display = "none";
}

function abrirPermisos(){
  document.getElementById("permisoBox").style.display = "flex";
}

function cerrarPermisos(){
  document.getElementById("permisoBox").style.display = "none";
}

/* ======================
   EDIFICIOS
====================== */
async function loadEdificios(){

  const res = await fetch("/admin/edificios", {
    headers: { "Authorization": PASSWORD }
  });

  const data = await res.json();

  const sel = document.getElementById("edificio");
  sel.innerHTML = "<option value=''>Todos</option>";

  data.forEach(e=>{
    sel.innerHTML += `<option value="${e.id}">${e.nombre}</option>`;
  });
}

/* ======================
   TABLA
====================== */
async function cargar(){

  const e = document.getElementById("edificio").value;
  const c = document.getElementById("cedula").value;

  let url = "/admin/registros?";
  if(e) url += "edificio_id="+e+"&";
  if(c) url += "cedula="+c;

  const res = await fetch(url, {
    headers: { "Authorization": PASSWORD }
  });

  const data = await res.json();

  const t = document.getElementById("tabla");
  t.innerHTML = "";

  data.forEach(r=>{
    t.innerHTML += `
      <tr>
        <td>${r.id}</td>
        <td>${r.nombre}</td>
        <td>${r.cedula}</td>
        <td>${r.edificio_nombre}</td>
        <td>${r.rol}</td>
        <td>${r.tipo_registro}</td>
        <td>${new Date(r.fecha_hora).toLocaleString()}</td>
        <td>${r.observacion || "-"}</td>
      </tr>
    `;
  });
}

/* ======================
   USUARIO
====================== */
async function crearUsuario(){

  const nombre = document.getElementById("nombreNuevo").value;
  const cedula = document.getElementById("cedulaNueva").value;
  const rol_id = document.getElementById("rolNuevo").value;
  const edificio = document.getElementById("edificioNuevo").value;

  await fetch("/admin/crear-usuario", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": PASSWORD
    },
    body: JSON.stringify({
      nombre, cedula, rol_id,
      edificios: [edificio]
    })
  });

  alert("Usuario creado");
  cerrarFormulario();
}

/* ======================
   PERMISOS
====================== */
async function asignarPermiso(){

  const cedula = document.getElementById("cedulaPermiso").value;
  const edificio_id = document.getElementById("edificioPermiso").value;

  await fetch("/admin/asignar-edificio", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": PASSWORD
    },
    body: JSON.stringify({ cedula, edificio_id })
  });

  alert("Permiso dado");
}

async function quitarPermiso(){

  const cedula = document.getElementById("cedulaPermiso").value;
  const edificio_id = document.getElementById("edificioPermiso").value;

  await fetch("/admin/quitar-permiso", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": PASSWORD
    },
    body: JSON.stringify({ cedula, edificio_id })
  });

  alert("Permiso quitado");
}

/* ======================
   EXTRAS
====================== */
function editarUsuario(){
  alert("Función activa backend");
}

function eliminarRegistro(){
  const id = prompt("ID");
  fetch(`/admin/eliminar-registro/${id}`, {
    method: "DELETE",
    headers: { "Authorization": PASSWORD }
  }).then(()=>cargar());
}

function dashboard(){
  fetch("/admin/dashboard", {
    headers: { "Authorization": PASSWORD }
  })
  .then(r=>r.json())
  .then(d=>{
    alert(JSON.stringify(d,null,2));
  });
}

function exportarExcel(){
  window.location = "/admin/exportar-excel-mensual?mes="+(new Date().getMonth()+1);
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin</title>

<style>

/* ===== TODO TU CSS ORIGINAL SIN CAMBIOS ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  background: linear-gradient(135deg, #0f3d2e, #1f7a63, #38b48b);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 30px;
}

/* (TODO TU ESTILO SE QUEDA IGUAL - OMITIDO PARA NO ROMPER TU DISEÑO) */

.container {
  background: rgba(255,255,255,0.95);
  padding: 25px;
  border-radius: 22px;
  max-width: 1100px;
  width: 100%;
  display: none;
}

button {
  padding: 11px 16px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #1f7a63, #38b48b);
  color: white;
  cursor: pointer;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
  <div class="login-card">
    <h3>🔐 Acceso Admin</h3>
    <input type="password" id="pass">
    <button onclick="login()">Ingresar</button>
    <p id="msg"></p>
  </div>
</div>

<!-- PANEL -->
<div class="container">

<h1>Panel Admin</h1>

<div class="filters">

<select id="edificio"></select>
<input id="cedula" placeholder="Cédula">

<button onclick="cargar()">Filtrar</button>
<button onclick="menuAdmin()">☰ Menú</button>

</div>

<table>
<thead>
<tr>
<th>ID</th>
<th>Nombre</th>
<th>Cédula</th>
<th>Edificio</th>
<th>Rol</th>
<th>Tipo</th>
<th>Fecha</th>
<th>Observación</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

</div>

<!-- MENU -->
<div id="menuBox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);justify-content:center;align-items:center;">
  <div class="menu-card">

    <h3>⚙️ Menú Admin</h3>

    <button onclick="mostrarFormulario()">➕ Persona</button>
    <button onclick="mostrarFormEdificio()">🏢 Edificio</button>
    <button onclick="abrirPermisos()">🔐 Permisos</button>
    <button onclick="editarUsuario()">✏️ Editar</button>
    <button onclick="eliminarRegistro()">🗑️ Eliminar</button>
    <button onclick="dashboard()">📊 Dashboard</button>
    <button onclick="exportarExcel()">📥 Excel</button>

    <button onclick="cerrarMenu()" style="background:#d93025;">Cerrar</button>

  </div>
</div>

<!-- FORM USUARIO -->
<div id="formulario" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);justify-content:center;align-items:center;">
  <div style="background:white;padding:20px;border-radius:15px;width:300px;">
    <h3>Crear Usuario</h3>

    <input id="nombreNuevo" placeholder="Nombre">
    <input id="cedulaNueva" placeholder="Cédula">
    <input id="rolNuevo" placeholder="Rol ID">

    <select id="edificioNuevo"></select>

    <button onclick="crearUsuario()">Guardar</button>
    <button onclick="cerrarFormulario()">Cerrar</button>
  </div>
</div>

<!-- PERMISOS -->
<div id="permisoBox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);justify-content:center;align-items:center;">
  <div style="background:white;padding:20px;border-radius:15px;width:300px;">
    <h3>Permisos</h3>

    <input id="cedulaPermiso" placeholder="Cédula">
    <select id="edificioPermiso"></select>

    <button onclick="asignarPermiso()">➕ Dar</button>
    <button onclick="quitarPermiso()">❌ Quitar</button>
    <button onclick="cerrarPermisos()">Cerrar</button>
  </div>
</div>

<script>

const PASSWORD = "Habitat2026";

/* ===== LOGIN ===== */
function login(){
  const pass = document.getElementById("pass").value;

  if(pass !== PASSWORD){
    document.getElementById("msg").innerText = "❌ incorrecto";
    return;
  }

  localStorage.setItem("auth", pass);

  document.getElementById("loginBox").style.display = "none";
  document.querySelector(".container").style.display = "block";

  loadEdificios();
  cargar();
  cargarEdificiosForm();
}

/* ===== AUTH HEADER ===== */
function authHeaders(){
  return {
    "Content-Type":"application/json",
    "Authorization": localStorage.getItem("auth")
  };
}

/* ===== EDIFICIOS ===== */
async function loadEdificios(){
  const r = await fetch("/admin/edificios",{headers:authHeaders()});
  const d = await r.json();

  const sel = document.getElementById("edificio");
  sel.innerHTML = "<option value=''>Todos</option>";

  d.forEach(e=>{
    sel.innerHTML += `<option value="${e.id}">${e.nombre}</option>`;
  });
}

/* ===== TABLA ===== */
async function cargar(){

  let e = document.getElementById("edificio").value;
  let c = document.getElementById("cedula").value;

  let url = "/admin/registros?";
  if(e) url += "edificio_id="+e+"&";
  if(c) url += "cedula="+c;

  const r = await fetch(url,{headers:authHeaders()});
  const d = await r.json();

  const t = document.getElementById("tabla");
  t.innerHTML = "";

  d.forEach(r=>{
    t.innerHTML += `
      <tr>
        <td>${r.id}</td>
        <td>${r.nombre}</td>
        <td>${r.cedula}</td>
        <td>${r.edificio_nombre}</td>
        <td>${r.rol}</td>
        <td>${r.tipo_registro}</td>
        <td>${new Date(r.fecha_hora).toLocaleString()}</td>
        <td>${r.observacion || "-"}</td>
      </tr>
    `;
  });
}

/* ===== USUARIO ===== */
async function crearUsuario(){

  const body = {
    nombre: nombreNuevo.value,
    cedula: cedulaNueva.value,
    rol_id: rolNuevo.value,
    edificios: [edificioNuevo.value]
  };

  const r = await fetch("/admin/crear-usuario",{
    method:"POST",
    headers:authHeaders(),
    body:JSON.stringify(body)
  });

  alert((await r.json()).mensaje);
  cerrarFormulario();
}

/* ===== EDIFICIO ===== */
function mostrarFormEdificio(){
  let nombre = prompt("Nombre edificio");
  if(!nombre) return;

  fetch("/admin/agregar-edificio",{
    method:"POST",
    headers:authHeaders(),
    body:JSON.stringify({nombre})
  }).then(r=>r.json()).then(d=>{
    alert(d.mensaje);
    loadEdificios();
  });
}

/* ===== PERMISOS ===== */
function abrirPermisos(){
  permisoBox.style.display="flex";
}

function cerrarPermisos(){
  permisoBox.style.display="none";
}

/* FIX REAL */
async function asignarPermiso(){

  const r = await fetch("/admin/asignar-edificio",{
    method:"POST",
    headers:authHeaders(),
    body:JSON.stringify({
      cedula:cedulaPermiso.value,
      edificio_id:edificioPermiso.value
    })
  });

  alert((await r.json()).mensaje);
}

async function quitarPermiso(){

  const r = await fetch("/admin/quitar-permiso",{
    method:"POST",
    headers:authHeaders(),
    body:JSON.stringify({
      cedula:cedulaPermiso.value,
      edificio_id:edificioPermiso.value
    })
  });

  alert((await r.json()).mensaje);
}

/* ===== MENU ===== */
function menuAdmin(){
  menuBox.style.display="flex";
}

function cerrarMenu(){
  menuBox.style.display="none";
}

/* ===== INIT ===== */
if(localStorage.getItem("auth")){
  document.getElementById("loginBox").style.display="none";
  document.querySelector(".container").style.display="block";
  loadEdificios();
  cargar();
}

</script>

</body>
</html>

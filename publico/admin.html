<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  background: linear-gradient(135deg, #0f3d2e, #1f7a63, #38b48b);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 30px;
}

/* LOGIN */
#loginBox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.login-card {
  background: white;
  padding: 30px;
  border-radius: 18px;
  width: 320px;
  text-align: center;
}

/* CONTENEDOR */
.container {
  background: rgba(255,255,255,0.95);
  padding: 25px;
  border-radius: 22px;
  max-width: 1100px;
  width: 100%;
  display: none;
}

/* INPUTS */
select, input {
  padding: 11px;
  border-radius: 12px;
  border: 1px solid #ddd;
}

/* BOTONES */
button {
  padding: 11px 16px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #1f7a63, #38b48b);
  color: white;
  cursor: pointer;
}

/* TABLA (NO TOCADA) */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
  background: white;
  border-radius: 15px;
  overflow: hidden;
}

th {
  background: #1f7a63;
  color: white;
  padding: 12px;
}

td {
  padding: 12px;
  text-align: center;
  border-bottom: 1px solid #eee;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
  <div class="login-card">
    <h3>🔐 Acceso Admin</h3>
    <input type="password" id="pass" placeholder="Contraseña">
    <button onclick="login()">Ingresar</button>
    <p id="msg"></p>
  </div>
</div>

<!-- PANEL -->
<div class="container">

<h1>Panel Admin</h1>

<div class="filters">

<select id="edificio"></select>
<input id="cedula" placeholder="Cédula">

<button onclick="cargar()">Filtrar</button>
<button onclick="exportarExcel()">Excel</button>
<button onclick="mostrarFormulario()">➕ Persona</button>
<button onclick="mostrarFormEdificio()">🏢 Edificio</button>
<button onclick="abrirPermisos()">🔐 Permisos</button>
<button onclick="menuAdmin()">☰ Menú</button>

</div>

<table>
<thead>
<tr>
<th>ID</th>
<th>Nombre</th>
<th>Cédula</th>
<th>Edificio</th>
<th>Rol</th>
<th>Tipo</th>
<th>Fecha</th>
<th>Observación</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

</div>

<script>

const PASSWORD = "Habitat2026";
const EXPIRATION_TIME = 4 * 60 * 60 * 1000;

/* ================= LOGIN ================= */
function login(){
  const pass = document.getElementById("pass").value;

  if(pass !== PASSWORD){
    document.getElementById("msg").innerText = "❌ Incorrecto";
    return;
  }

  localStorage.setItem("auth", pass);
  localStorage.setItem("auth_time", Date.now());

  iniciarAdmin();
}

/* ================= AUTH ================= */
function checkAuth(){
  const auth = localStorage.getItem("auth");
  const time = localStorage.getItem("auth_time");

  if(!auth || !time) return false;
  if(Date.now() - time > EXPIRATION_TIME){
    localStorage.clear();
    return false;
  }
  return true;
}

/* ================= INIT ================= */
function iniciarAdmin(){
  document.getElementById("loginBox").style.display = "none";
  document.querySelector(".container").style.display = "block";

  // 🔥 ACTIVA BOTONES OCULTOS
  document.querySelectorAll("button").forEach(b=>{
    b.style.display = "inline-block";
  });

  loadEdificios();
  cargar();
}

/* ================= EDIFICIOS ================= */
async function loadEdificios(){

  const res = await fetch("/admin/edificios", {
    headers:{Authorization:localStorage.getItem("auth")}
  });

  const data = await res.json();

  const sel = document.getElementById("edificio");
  sel.innerHTML = "<option value=''>Todos</option>";

  data.forEach(e=>{
    sel.innerHTML += `<option value="${e.id}">${e.nombre}</option>`;
  });
}

/* ================= TABLA ================= */
async function cargar(){

  let e = document.getElementById("edificio").value;
  let c = document.getElementById("cedula").value;

  let url = "/admin/registros?";
  if(e) url += "edificio_id="+e+"&";
  if(c) url += "cedula="+c;

  const res = await fetch(url, {
    headers:{Authorization:localStorage.getItem("auth")}
  });

  const data = await res.json();

  const t = document.getElementById("tabla");
  t.innerHTML = "";

  data.forEach(r=>{
    const fecha = new Date(r.fecha_hora).toLocaleString("es-CO");

    t.innerHTML += `
      <tr>
        <td>${r.id}</td>
        <td>${r.nombre}</td>
        <td>${r.cedula}</td>
        <td>${r.edificio_nombre || r.edificio}</td>
        <td>${r.rol}</td>
        <td>${r.tipo_registro}</td>
        <td>${fecha}</td>
        <td>${r.observacion || "-"}</td>
      </tr>
    `;
  });
}

/* ================= PERSONA ================= */
function mostrarFormulario(){
  const f = document.getElementById("formulario");
  if(f) f.style.display = "flex";
}

function cerrarFormulario(){
  const f = document.getElementById("formulario");
  if(f) f.style.display = "none";
}

/* ================= EDIFICIO ================= */
function mostrarFormEdificio(){
  const nombre = prompt("Nombre edificio");
  if(!nombre) return;

  fetch("/admin/agregar-edificio", {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      Authorization:localStorage.getItem("auth")
    },
    body:JSON.stringify({nombre})
  })
  .then(r=>r.json())
  .then(d=>{
    alert(d.mensaje);
    loadEdificios();
  });
}

/* ================= PERMISOS FIX ================= */
function abrirPermisos(){
  const box = document.getElementById("permisoBox");
  if(box) box.style.display = "flex";
}

/* ================= EXPORT ================= */
async function exportarExcel(){

  const mes = new Date().getMonth()+1;

  const res = await fetch(`/admin/exportar-excel-mensual?mes=${mes}`, {
    headers:{Authorization:localStorage.getItem("auth")}
  });

  const blob = await res.blob();
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href=url;
  a.download="reporte.xlsx";
  a.click();
}

/* ================= INIT ================= */
if(checkAuth()) iniciarAdmin();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin</title>

<style>

/* ===== RESET ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

/* ===== FONDO PRO ===== */
body {
  background: linear-gradient(135deg, #0f3d2e, #1f7a63, #38b48b);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 30px;
}

/* ===== LOGIN ===== */
#loginBox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.login-card {
  background: white;
  padding: 30px;
  border-radius: 18px;
  width: 320px;
  text-align: center;
}

.login-card input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  border: 1px solid #ddd;
}

.login-card button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #1f7a63;
  color: white;
}

/* ===== CONTENEDOR ===== */
.container {
  background: rgba(255,255,255,0.95);
  padding: 25px;
  border-radius: 22px;
  max-width: 1100px;
  width: 100%;
  display: none;
}

/* ===== TITULO ===== */
h1 {
  text-align: center;
  color: #0f3d2e;
  margin-bottom: 20px;
}

/* ===== FILTROS ===== */
.filters {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

select, input {
  padding: 11px;
  border-radius: 12px;
  border: 1px solid #ddd;
  flex: 1;
}

/* ===== BOTONES ===== */
button {
  padding: 11px 16px;
  border: none;
  border-radius: 12px;
  background: #1f7a63;
  color: white;
  cursor: pointer;
}

/* ===== TABLA ===== */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
}

th {
  background: #1f7a63;
  color: white;
  padding: 12px;
}

td {
  padding: 12px;
  text-align: center;
  border-bottom: 1px solid #eee;
}

/* ===== MODALES ===== */
#formulario, #permisoBox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.modal-card {
  background: white;
  padding: 25px;
  border-radius: 15px;
  width: 320px;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
  <div class="login-card">
    <h3>Acceso Admin</h3>
    <input type="password" id="pass">
    <button onclick="login()">Ingresar</button>
    <p id="msg"></p>
  </div>
</div>

<!-- ADMIN -->
<div class="container">

<h1>Panel Admin</h1>

<div class="filters">
  <select id="edificio"></select>
  <input id="cedula" placeholder="Cédula">

  <button onclick="cargar()">Filtrar</button>
  <button onclick="menuAdmin()">☰ Menú</button>
</div>

<table>
<thead>
<tr>
<th>ID</th>
<th>Nombre</th>
<th>Cédula</th>
<th>Edificio</th>
<th>Rol</th>
<th>Tipo</th>
<th>Fecha</th>
<th>Observación</th>
</tr>
</thead>

<tbody id="tabla"></tbody>
</table>

</div>

<!-- MENU -->
<div id="menuBox">
  <div class="modal-card">
    <h3>Menú</h3>

    <button onclick="mostrarFormulario()">➕ Persona</button>
    <button onclick="mostrarFormEdificio()">🏢 Edificio</button>
    <button onclick="abrirPermisos()">🔐 Permisos</button>
    <button onclick="editarUsuario()">✏️ Editar</button>
    <button onclick="eliminarRegistro()">🗑️ Eliminar</button>
    <button onclick="dashboard()">📊 Dashboard</button>
    <button onclick="exportarExcel()">📥 Excel</button>

    <button onclick="cerrarMenu()" style="background:red;">Cerrar</button>
  </div>
</div>

<!-- FORM USUARIO -->
<div id="formulario">
  <div class="modal-card">
    <h3>Crear Usuario</h3>

    <input id="nombreNuevo" placeholder="Nombre">
    <input id="cedulaNueva" placeholder="Cédula">
    <input id="rolNuevo" placeholder="Rol ID">

    <select id="edificioNuevo"></select>

    <button onclick="crearUsuario()">Guardar</button>
    <button onclick="cerrarFormulario()">Cerrar</button>
  </div>
</div>

<!-- PERMISOS -->
<div id="permisoBox">
  <div class="modal-card">
    <h3>Permisos</h3>

    <input id="cedulaPermiso" placeholder="Cédula">
    <select id="edificioPermiso"></select>

    <button onclick="asignarPermiso()">Dar acceso</button>
    <button onclick="quitarPermiso()">Quitar acceso</button>
    <button onclick="cerrarPermisos()">Cerrar</button>

  </div>
</div>

<script>

const PASSWORD = "Habitat2026";

/* ===== LOGIN ===== */
function login(){
  const pass = document.getElementById("pass").value;

  if(pass !== PASSWORD){
    document.getElementById("msg").innerText = "Incorrecto";
    return;
  }

  localStorage.setItem("auth", pass);

  document.getElementById("loginBox").style.display = "none";
  document.querySelector(".container").style.display = "block";

  loadEdificios();
  cargar();
}

/* ===== EDIFICIOS ===== */
async function loadEdificios(){

  const res = await fetch("/admin/edificios", {
    headers: { Authorization: localStorage.getItem("auth") }
  });

  const data = await res.json();

  const sel = document.getElementById("edificio");
  sel.innerHTML = "<option value=''>Todos</option>";

  const sel2 = document.getElementById("edificioNuevo");
  const sel3 = document.getElementById("edificioPermiso");

  sel2.innerHTML = "";
  sel3.innerHTML = "";

  data.forEach(e=>{
    sel.innerHTML += `<option value="${e.id}">${e.nombre}</option>`;
    sel2.innerHTML += `<option value="${e.id}">${e.nombre}</option>`;
    sel3.innerHTML += `<option value="${e.id}">${e.nombre}</option>`;
  });
}

/* ===== TABLA ===== */
async function cargar(){

  let e = document.getElementById("edificio").value;
  let c = document.getElementById("cedula").value;

  let url = "/admin/registros?";

  if(e) url += "edificio_id="+e+"&";
  if(c) url += "cedula="+c;

  const res = await fetch(url, {
    headers: { Authorization: localStorage.getItem("auth") }
  });

  const data = await res.json();

  const t = document.getElementById("tabla");
  t.innerHTML = "";

  data.forEach(r=>{
    t.innerHTML += `
      <tr>
        <td>${r.id}</td>
        <td>${r.nombre}</td>
        <td>${r.cedula}</td>
        <td>${r.edificio}</td>
        <td>${r.rol}</td>
        <td>${r.tipo_registro}</td>
        <td>${r.fecha_hora}</td>
        <td>${r.observacion || "-"}</td>
      </tr>
    `;
  });
}

/* ===== MENU ===== */
function menuAdmin(){
  document.getElementById("menuBox").style.display = "flex";
}

function cerrarMenu(){
  document.getElementById("menuBox").style.display = "none";
}

/* ===== USUARIO ===== */
function mostrarFormulario(){
  document.getElementById("formulario").style.display = "flex";
}

function cerrarFormulario(){
  document.getElementById("formulario").style.display = "none";
}

async function crearUsuario(){

  const nombre = nombreNuevo.value;
  const cedula = cedulaNueva.value;
  const rol_id = rolNuevo.value;
  const edificio = edificioNuevo.value;

  await fetch("/admin/crear-usuario", {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      Authorization: localStorage.getItem("auth")
    },
    body: JSON.stringify({
      nombre, cedula, rol_id, edificios:[edificio]
    })
  });

  alert("Usuario creado");
  cerrarFormulario();
}

/* ===== PERMISOS ===== */
function abrirPermisos(){
  document.getElementById("permisoBox").style.display = "flex";
}

function cerrarPermisos(){
  document.getElementById("permisoBox").style.display = "none";
}

async function asignarPermiso(){

  await fetch("/admin/asignar-edificio",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      Authorization: localStorage.getItem("auth")
    },
    body: JSON.stringify({
      cedula: cedulaPermiso.value,
      edificio_id: edificioPermiso.value
    })
  });

  alert("Permiso dado");
}

async function quitarPermiso(){

  await fetch("/admin/quitar-permiso",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      Authorization: localStorage.getItem("auth")
    },
    body: JSON.stringify({
      cedula: cedulaPermiso.value,
      edificio_id: edificioPermiso.value
    })
  });

  alert("Permiso quitado");
}

/* ===== OTROS ===== */
function editarUsuario(){ alert("Usa API editar"); }
function eliminarRegistro(){ alert("Usa API eliminar"); }
function dashboard(){ alert("Usa dashboard"); }

function exportarExcel(){
  window.location = "/admin/exportar-excel-mensual?mes=" + (new Date().getMonth()+1);
}

</script>

</body>
</html>

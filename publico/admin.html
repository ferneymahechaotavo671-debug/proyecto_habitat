<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin</title>

<style>

/* ===== RESET ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

/* ===== FONDO ===== */
body {
  background: linear-gradient(135deg, #0f3d2e, #1f7a63, #38b48b);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 30px;
}

/* ===== LOGIN ===== */
#loginBox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.login-card {
  background: white;
  padding: 30px;
  border-radius: 18px;
  width: 320px;
  text-align: center;
}

/* ===== PANEL ===== */
.container {
  background: rgba(255,255,255,0.95);
  padding: 25px;
  border-radius: 22px;
  max-width: 1100px;
  width: 100%;
  display: none;
}

/* ===== TITULO ===== */
h1 {
  text-align: center;
  color: #0f3d2e;
  margin-bottom: 20px;
}

/* ===== FILTROS ===== */
.filters {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

select, input {
  padding: 11px;
  border-radius: 12px;
  border: 1px solid #ddd;
  flex: 1;
}

/* ===== BOTONES ===== */
button {
  padding: 11px 16px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #1f7a63, #38b48b);
  color: white;
  cursor: pointer;
}

/* ===== TABLA ===== */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
  background: white;
  border-radius: 15px;
  overflow: hidden;
}

th {
  background: #1f7a63;
  color: white;
  padding: 12px;
}

td {
  padding: 12px;
  text-align: center;
  border-bottom: 1px solid #eee;
}

/* ===== MENU TARJETAS ===== */
#menuBox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  justify-content: center;
  align-items: center;
}

.menu-card {
  background: white;
  padding: 25px;
  border-radius: 20px;
  width: 350px;
  display: grid;
  gap: 10px;
  text-align: center;
}

.menu-card h3 {
  color: #0f3d2e;
  margin-bottom: 10px;
}

.menu-card button {
  width: 100%;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
  <div class="login-card">
    <h3>🔐 Acceso Admin</h3>
    <input type="password" id="pass">
    <button onclick="login()">Ingresar</button>
  </div>
</div>

<!-- PANEL -->
<div class="container">

<h1>Panel Admin</h1>

<div class="filters">

<select id="edificio"></select>
<input id="cedula" placeholder="Cédula">

<button onclick="cargar()">Filtrar</button>
<button onclick="menuAdmin()">☰ Menú</button>

</div>

<table>
<thead>
<tr>
<th>ID</th>
<th>Nombre</th>
<th>Cédula</th>
<th>Edificio</th>
<th>Rol</th>
<th>Tipo</th>
<th>Fecha</th>
<th>Observación</th>
</tr>
</thead>

<tbody id="tabla"></tbody>
</table>

</div>

<!-- MENÚ TARJETAS -->
<div id="menuBox">

  <div class="menu-card">

    <h3>⚙️ Panel de Control</h3>

    <button onclick="mostrarFormulario()">➕ Crear Usuario</button>
    <button onclick="mostrarFormEdificio()">🏢 Crear Edificio</button>
    <button onclick="abrirPermisos()">🔐 Permisos</button>
    <button onclick="editarUsuario()">✏️ Editar Usuario</button>
    <button onclick="eliminarRegistro()">🗑️ Eliminar Registro</button>
    <button onclick="dashboard()">📊 Dashboard</button>
    <button onclick="exportarExcel()">📥 Exportar Excel</button>

    <button onclick="cerrarMenu()">❌ Cerrar</button>

  </div>

</div>

<!-- FORM USUARIO -->
<div id="formulario" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);justify-content:center;align-items:center;">
  <div style="background:white;padding:20px;border-radius:15px;width:300px;">
    <h3>Crear Usuario</h3>

    <input id="nombreNuevo" placeholder="Nombre">
    <input id="cedulaNueva" placeholder="Cédula">
    <input id="rolNuevo" placeholder="Rol ID">

    <select id="edificioNuevo"></select>

    <button onclick="crearUsuario()">Guardar</button>
    <button onclick="cerrarFormulario()">Cerrar</button>
  </div>
</div>

<!-- PERMISOS -->
<div id="permisoBox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);justify-content:center;align-items:center;">
  <div style="background:white;padding:20px;border-radius:15px;width:300px;">
    <h3>Permisos</h3>

    <input id="cedulaPermiso" placeholder="Cédula">
    <select id="edificioPermiso"></select>

    <button onclick="asignarPermiso()">➕ Dar acceso</button>
    <button onclick="quitarPermiso()">❌ Quitar acceso</button>
    <button onclick="cerrarPermisos()">Cerrar</button>
  </div>
</div>

<script>

const PASS = "Habitat2026";

/* ===== LOGIN ===== */
function login(){
  if(pass.value !== PASS) return alert("❌");

  localStorage.setItem("auth", PASS);

  loginBox.style.display="none";
  document.querySelector(".container").style.display="block";

  loadEdificios();
  cargar();
}

/* ===== AUTH ===== */
function auth(){
  return {
    "Content-Type":"application/json",
    "Authorization": localStorage.getItem("auth")
  };
}

/* ===== EDIFICIOS ===== */
async function loadEdificios(){
  const r = await fetch("/admin/edificios",{headers:auth()});
  const d = await r.json();

  edificio.innerHTML = "<option value=''>Todos</option>";
  edificioNuevo.innerHTML = "";
  edificioPermiso.innerHTML = "";

  d.forEach(e=>{
    edificio.innerHTML += `<option value="${e.id}">${e.nombre}</option>`;
    edificioNuevo.innerHTML += `<option value="${e.id}">${e.nombre}</option>`;
    edificioPermiso.innerHTML += `<option value="${e.id}">${e.nombre}</option>`;
  });
}

/* ===== TABLA ===== */
async function cargar(){

  let url = "/admin/registros?";

  if(edificio.value) url += "edificio_id="+edificio.value+"&";
  if(cedula.value) url += "cedula="+cedula.value;

  const r = await fetch(url,{headers:auth()});
  const d = await r.json();

  tabla.innerHTML="";

  d.forEach(r=>{
    tabla.innerHTML += `
    <tr>
      <td>${r.id}</td>
      <td>${r.nombre}</td>
      <td>${r.cedula}</td>
      <td>${r.edificio_nombre}</td>
      <td>${r.rol}</td>
      <td>${r.tipo_registro}</td>
      <td>${new Date(r.fecha_hora).toLocaleString()}</td>
      <td>${r.observacion || "-"}</td>
    </tr>`;
  });
}

/* ===== USUARIO ===== */
async function crearUsuario(){

  const r = await fetch("/admin/crear-usuario",{
    method:"POST",
    headers:auth(),
    body:JSON.stringify({
      nombre:nombreNuevo.value,
      cedula:cedulaNueva.value,
      rol_id:rolNuevo.value,
      edificios:[edificioNuevo.value]
    })
  });

  alert((await r.json()).mensaje);
  cerrarFormulario();
}

/* ===== EDIFICIO ===== */
function mostrarFormEdificio(){
  let n = prompt("Nombre edificio");
  if(!n) return;

  fetch("/admin/agregar-edificio",{
    method:"POST",
    headers:auth(),
    body:JSON.stringify({nombre:n})
  }).then(r=>r.json()).then(d=>{
    alert(d.mensaje);
    loadEdificios();
  });
}

/* ===== MENÚ ===== */
function menuAdmin(){
  menuBox.style.display="flex";
}

function cerrarMenu(){
  menuBox.style.display="none";
}

/* ===== PERMISOS ===== */
function abrirPermisos(){
  permisoBox.style.display="flex";
}

function cerrarPermisos(){
  permisoBox.style.display="none";
}

async function asignarPermiso(){
  const r = await fetch("/admin/asignar-edificio",{
    method:"POST",
    headers:auth(),
    body:JSON.stringify({
      cedula:cedulaPermiso.value,
      edificio_id:edificioPermiso.value
    })
  });

  alert((await r.json()).mensaje);
}

async function quitarPermiso(){
  const r = await fetch("/admin/quitar-permiso",{
    method:"POST",
    headers:auth(),
    body:JSON.stringify({
      cedula:cedulaPermiso.value,
      edificio_id:edificioPermiso.value
    })
  });

  alert((await r.json()).mensaje);
}

/* ===== INIT ===== */
if(localStorage.getItem("auth")){
  loginBox.style.display="none";
  document.querySelector(".container").style.display="block";
  loadEdificios();
  cargar();
}

</script>

</body>
</html>

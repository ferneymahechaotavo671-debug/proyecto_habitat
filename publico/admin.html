<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{
background:linear-gradient(135deg,#0f3d2e,#1f7a63,#38b48b);
min-height:100vh;
display:flex;
justify-content:center;
align-items:flex-start;
padding:30px;
}

#loginBox{
position:fixed;inset:0;
background:rgba(0,0,0,0.6);
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.login-card{
background:white;
padding:30px;
border-radius:15px;
width:320px;
text-align:center;
}

.login-card input{
width:100%;
padding:10px;
margin:10px 0;
border-radius:10px;
border:1px solid #ddd;
}

.login-card button{
width:100%;
padding:10px;
background:#1f7a63;
color:white;
border:none;
border-radius:10px;
}

.container{
display:none;
background:white;
padding:20px;
border-radius:15px;
width:100%;
max-width:1100px;
}

h1{text-align:center;margin-bottom:20px}

.filters{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:15px;
}

select,input{
padding:10px;
border-radius:10px;
border:1px solid #ddd;
flex:1;
}

button{
padding:10px;
background:#1f7a63;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th{
background:#1f7a63;
color:white;
padding:10px;
}

td{
padding:10px;
text-align:center;
border-bottom:1px solid #eee;
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,0.6);
display:none;
justify-content:center;
align-items:center;
}

.card{
background:white;
padding:20px;
border-radius:12px;
width:320px;
}

.card input, .card select{
width:100%;
margin:8px 0;
padding:10px;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
<div class="login-card">
<h3>Admin</h3>
<input type="password" id="pass">
<button onclick="login()">Entrar</button>
</div>
</div>

<!-- PANEL -->
<div class="container">

<h1>Panel Admin</h1>

<div class="filters">
<select id="edificio"></select>
<input id="cedula" placeholder="Cédula">
<button onclick="cargar()">Filtrar</button>
<button onclick="menu()">Menú</button>
</div>

<table>
<thead>
<tr>
<th>ID</th>
<th>Nombre</th>
<th>Cédula</th>
<th>Edificio</th>
<th>Rol</th>
<th>Tipo</th>
<th>Fecha</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

</div>

<!-- MENU -->
<div class="modal" id="menuBox">
<div class="card">
<h3>Menú</h3>

<button onclick="abrirUsuario()">Crear Usuario</button>
<button onclick="abrirEdificio()">Crear Edificio</button>
<button onclick="abrirPermisos()">Permisos</button>
<button onclick="cerrar()">Cerrar</button>

</div>
</div>

<!-- USUARIO -->
<div class="modal" id="userBox">
<div class="card">
<h3>Usuario</h3>

<input id="nombre" placeholder="Nombre">
<input id="cedulaU" placeholder="Cédula">
<input id="rol" placeholder="Rol ID">

<button onclick="crearUsuario()">Guardar</button>
<button onclick="cerrarUser()">Cerrar</button>
</div>
</div>

<!-- EDIFICIO -->
<div class="modal" id="edificioBox">
<div class="card">
<h3>Edificio</h3>

<input id="nombreE" placeholder="Nombre">

<button onclick="crearEdificio()">Guardar</button>
<button onclick="cerrarE()">Cerrar</button>
</div>
</div>

<!-- PERMISOS -->
<div class="modal" id="permisoBox">
<div class="card">
<h3>Permisos</h3>

<input id="cedulaP" placeholder="Cédula">
<select id="edificioP"></select>

<button onclick="asignar()">Dar</button>
<button onclick="quitar()">Quitar</button>
<button onclick="cerrarP()">Cerrar</button>

</div>
</div>

<script>

const PASS="Habitat2026";

/* LOGIN */
function login(){
if(pass.value!==PASS) return alert("Error");

localStorage.setItem("auth",PASS);

loginBox.style.display="none";
document.querySelector(".container").style.display="block";

loadEdificios();
cargar();
}

/* EDIFICIOS */
async function loadEdificios(){

const r=await fetch("/admin/edificios");
const d=await r.json();

edificio.innerHTML="";
edificioP.innerHTML="";

d.forEach(e=>{
edificio.innerHTML+=`<option value="${e.id}">${e.nombre}</option>`;
edificioP.innerHTML+=`<option value="${e.id}">${e.nombre}</option>`;
});
}

/* REGISTROS */
async function cargar(){

let e=edificio.value;
let c=cedula.value;

let url="/admin/registros?";

if(e) url+="edificio_id="+e+"&";
if(c) url+="cedula="+c;

const r=await fetch(url,{
headers:{Authorization:PASS}
});

const d=await r.json();

tabla.innerHTML="";

d.forEach(r=>{
tabla.innerHTML+=`
<tr>
<td>${r.id}</td>
<td>${r.nombre}</td>
<td>${r.cedula}</td>
<td>${r.edificio}</td>
<td>${r.rol}</td>
<td>${r.tipo_registro}</td>
<td>${r.fecha_hora}</td>
</tr>`;
});
}

/* MODALES */
function menu(){menuBox.style.display="flex"}
function cerrar(){menuBox.style.display="none"}

function abrirUsuario(){userBox.style.display="flex"}
function cerrarUser(){userBox.style.display="none"}

function abrirEdificio(){edificioBox.style.display="flex"}
function cerrarE(){edificioBox.style.display="none"}

function abrirPermisos(){permisoBox.style.display="flex"}
function cerrarP(){permisoBox.style.display="none"}

/* USUARIO */
async function crearUsuario(){

await fetch("/admin/crear-usuario",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:PASS
},
body:JSON.stringify({
nombre:nombre.value,
cedula:cedulaU.value,
rol_id:rol.value
})
});

alert("OK");
cerrarUser();
}

/* EDIFICIO */
async function crearEdificio(){

await fetch("/admin/agregar-edificio",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:PASS
},
body:JSON.stringify({
nombre:nombreE.value
})
});

alert("OK");
cerrarE();
loadEdificios();
}

/* PERMISOS */
async function asignar(){

await fetch("/admin/asignar-edificio",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:PASS
},
body:JSON.stringify({
cedula:cedulaP.value,
edificio_id:edificioP.value
})
});

alert("OK");
}

async function quitar(){

await fetch("/admin/quitar-permiso",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:PASS
},
body:JSON.stringify({
cedula:cedulaP.value,
edificio_id:edificioP.value
})
});

alert("OK");
}

</script>

</body>
</html>

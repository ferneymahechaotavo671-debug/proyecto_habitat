<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin PRO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{
background:linear-gradient(135deg,#0f3d2e,#1f7a63,#38b48b);
min-height:100vh;
padding:20px;
}

/* LOGIN */
#loginBox{
position:fixed;inset:0;
background:rgba(0,0,0,0.6);
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.login-card{
background:white;
padding:30px;
border-radius:15px;
width:320px;
text-align:center;
}

.login-card input{
width:100%;
padding:10px;
margin:10px 0;
border-radius:10px;
border:1px solid #ddd;
}

.login-card button{
width:100%;
padding:10px;
background:#1f7a63;
color:white;
border:none;
border-radius:10px;
}

/* PANEL */
.container{
display:none;
background:white;
padding:20px;
border-radius:15px;
max-width:1200px;
margin:auto;
}

h1{text-align:center;margin-bottom:10px}

/* FILTROS */
.filters{
display:flex;
gap:10px;
flex-wrap:wrap;
margin:10px 0;
}

select,input,button{
padding:10px;
border-radius:10px;
border:1px solid #ddd;
}

button{
background:#1f7a63;
color:white;
border:none;
cursor:pointer;
}

/* TABLA */
table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th{
background:#1f7a63;
color:white;
padding:10px;
}

td{
padding:10px;
text-align:center;
border-bottom:1px solid #eee;
}

/* DASH */
.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin:15px 0;
}

.box{
background:#0f3d2e;
color:white;
padding:15px;
border-radius:10px;
text-align:center;
}

.alerta{
color:red;
font-weight:bold;
}

/* MODAL */
.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,0.6);
display:none;
justify-content:center;
align-items:flex-start;
overflow-y:auto;
padding:30px 10px;
z-index:9999;
}

.card{
background:white;
padding:20px;
border-radius:12px;
width:320px;
max-height:90vh;
overflow-y:auto;
}

.card input, .card select{
width:100%;
padding:10px;
margin:6px 0;
}

.card button{
width:100%;
margin-top:5px;
}
</style>
</head>

<body>

<!-- LOGO -->
<div style="text-align:center;margin-bottom:10px;">
  <img src="logo.png" width="100">
</div>

<!-- LOGIN -->
<div id="loginBox">
<div class="login-card">
<h3>Admin</h3>
<input type="password" id="pass">
<button onclick="login()">Entrar</button>
</div>
</div>

<!-- PANEL -->
<div class="container">

<h1>Panel Admin PRO</h1>

<!-- DASHBOARD -->
<div class="grid">
<div class="box">Entradas<br><span id="entradas">0</span></div>
<div class="box">Salidas<br><span id="salidas">0</span></div>
<div class="box alerta">Alertas<br><span id="alertas">0</span></div>
</div>

<canvas id="chart"></canvas>

<!-- FILTROS -->
<div class="filters">
<select id="edificio"></select>
<input id="cedula" placeholder="Cédula">

<button onclick="cargar()">🔎 Filtrar</button>

<button onclick="exportarExcel()">
📥 Excel
</button>

<button onclick="menu()">☰ Menú</button>
</div>

<!-- TABLA -->
<table>
<thead>
<tr>
<th>ID</th>
<th>Nombre</th>
<th>Cédula</th>
<th>Edificio</th>
<th>Rol</th>
<th>Tipo</th>
<th>Fecha</th>
<th>Obs</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

</div>

<!-- MENU -->
<div class="modal" id="menuBox">
<div class="card">
<h3>MENÚ</h3>

<button onclick="abrirUsuario()">➕ Usuario</button>
<button onclick="abrirEdificio()">🏢 Edificio</button>
<button onclick="abrirPermisos()">🔐 Permisos</button>
<button onclick="abrirDash()">📊 Dashboard</button>
<button onclick="cerrar()">Cerrar</button>

</div>
</div>

<!-- USUARIO -->
<div class="modal" id="userBox">
<div class="card">
<h3>Usuario</h3>

<button onclick="userBox.style.display='none'" 
style="background:red;float:right;width:auto;padding:5px 10px;">
✖
</button>

<input id="nombre" placeholder="Nombre">
<input id="cedulaU" placeholder="Cédula">
<input id="rol" placeholder="Rol ID">

<button onclick="crearUsuario()">Guardar</button>
</div>
</div>

<!-- EDIFICIO -->
<div class="modal" id="edificioBox">
<div class="card">
<h3>Edificio</h3>

<button onclick="edificioBox.style.display='none'"
style="background:red;float:right;width:auto;padding:5px 10px;">
✖
</button>

<input id="nombreE" placeholder="Nombre">

<button onclick="crearEdificio()">Guardar</button>
</div>
</div>

<!-- PERMISOS -->
<div class="modal" id="permisoBox">
<div class="card">
<h3>Permisos</h3>

<button onclick="permisoBox.style.display='none'"
style="background:red;float:right;width:auto;padding:5px 10px;">
✖
</button>

<button onclick="abrirDispositivos()">
📱 Dispositivos
</button>

</div>
</div>

<!-- DASHBOARD -->
<div class="modal" id="dashBox">
<div class="card">
<h3>Dashboard</h3>
<canvas id="dashChart"></canvas>
<button onclick="cerrarDash()">Cerrar</button>
</div>
</div>

<script>

const PASS="Habitat2026";

/* LOGIN */
function login(){
if(pass.value!==PASS) return alert("Error");

loginBox.style.display="none";
document.querySelector(".container").style.display="block";

loadEdificios();
cargar();
setInterval(cargar,15000);
}

/* EDIFICIOS */
async function loadEdificios(){

const r = await fetch("/admin/edificios", {
headers:{
Authorization:PASS
}
});
const d=await r.json();

edificio.innerHTML="";
manualEdificio.innerHTML="";

d.forEach(e=>{

edificio.innerHTML += `
<option value="${e.id}">
${e.nombre}
</option>`;

manualEdificio.innerHTML += `
<option value="${e.id}">
${e.nombre}
</option>`;

});
}

/* CARGAR */
async function cargar(){

const edificioId = edificio.value;
const ced = cedula.value;

let url = "/admin/registros?";

if(edificioId){
url += `edificio_id=${edificioId}&`;
}

if(ced){
url += `cedula=${ced}`;
}

const r = await fetch(url,{
headers:{Authorization:PASS}
});

const d = await r.json();

tabla.innerHTML="";

let ent=0,sal=0,alert=0;

d.forEach(r=>{

if(r.tipo_registro==="Entrada") ent++;
if(r.tipo_registro==="Salida") sal++;
if(r.observacion) alert++;

tabla.innerHTML+=`
<tr>
<td>${r.id}</td>
<td>${r.nombre}</td>
<td>${r.cedula}</td>
<td>${r.edificio}</td>
<td>${r.rol}</td>
<td>${r.tipo_registro}</td>

<td>
${new Date(r.fecha_hora).toLocaleString("es-CO")}
</td>

<td style="color:red">${r.observacion||"-"}</td>
</tr>`;
});

entradas.innerText=ent;
salidas.innerText=sal;
alertas.innerText=alert;

updateChart(ent,sal,alert);
}

/* CHART */
let chart;

function updateChart(e,s,a){

const ctx=document.getElementById("chart");

if(chart) chart.destroy();

chart=new Chart(ctx,{
type:"bar",
data:{
labels:["Entradas","Salidas","Alertas"],
datasets:[{
data:[e,s,a],
backgroundColor:["#1f7a63","#38b48b","red"]
}]
}
});
}

function exportarExcel(){

let e = edificio.value;
let c = cedula.value;

let url = "/admin/exportar-excel?";

if(e) url += "edificio_id=" + e + "&";

if(c) url += "cedula=" + c;

window.location = url;

}

/* DASHBOARD */
let dash;

function abrirDash(){
dashBox.style.display="flex";

const ctx=document.getElementById("dashChart");

if(dash) dash.destroy();

dash=new Chart(ctx,{
type:"pie",
data:{
labels:["Entradas","Salidas","Alertas"],
datasets:[{
data:[
Number(entradas.innerText),
Number(salidas.innerText),
Number(alertas.innerText)
]
}]
}
});
}

function cerrarDash(){
dashBox.style.display="none";
if(dash) dash.destroy();
}

/* MENU */
function menu(){menuBox.style.display="flex"}
function cerrar(){menuBox.style.display="none"}

/* USUARIO */
function abrirUsuario(){userBox.style.display="flex"}
async function crearUsuario(){

await fetch("/admin/crear-usuario",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:PASS
},
body:JSON.stringify({
nombre:nombre.value,
cedula:cedulaU.value,
rol_id:rol.value
})
});

alert("Usuario creado");
userBox.style.display="none";
}

/* EDIFICIO */
function abrirEdificio(){edificioBox.style.display="flex"}

async function crearEdificio(){

await fetch("/admin/agregar-edificio",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:PASS
},
body:JSON.stringify({nombre:nombreE.value})
});

alert("Edificio creado");
edificioBox.style.display="none";
loadEdificios();
}

/* PERMISOS */
function abrirPermisos(){permisoBox.style.display="flex"}

async function asignar(){

await fetch("/admin/asignar-edificio",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:PASS
},
body:JSON.stringify({
cedula:cedulaP.value,
edificio_id:edificioP.value
})
});

alert("Permiso dado");
}

async function quitar(){

await fetch("/admin/quitar-permiso",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:PASS
},
body:JSON.stringify({
cedula:cedulaP.value,
edificio_id:edificioP.value
})
});

alert("Permiso quitado");
}

// =========================
// ABRIR DISPOSITIVOS
// =========================
function abrirDispositivos(){

loadDispositivos();

deviceBox.style.display = "flex";

}

function cerrarDispositivos(){

deviceBox.style.display = "none";

}

// =========================
// CARGAR DISPOSITIVOS
// =========================
async function loadDispositivos(){

const r = await fetch("/admin/dispositivos",{
headers:{
Authorization:PASS
}
});

const data = await r.json();

tablaDevices.innerHTML = "";

data.forEach(d=>{

const estado = d.autorizado == 1
? "✅ Autorizado"
: "⏳ Pendiente";

const boton = d.autorizado == 1
? `<button onclick="bloquear(${d.id})" style="background:red;">
Bloquear
</button>`
: `<button onclick="aprobar(${d.id})">
Aprobar
</button>`;

tablaDevices.innerHTML += `
<tr>

<td>${d.id}</td>

<td>${d.nombre || '-'}</td>

<td>${d.cedula}</td>

<td>${d.edificio || '-'}</td>

<td>${estado}</td>

<td style="
max-width:220px;
word-break:break-all;
font-size:12px;
">
${d.device_id || '-'}
</td>

<td>
${boton}
</td>

</tr>`;

});

}

// =========================
// APROBAR
// =========================
async function aprobar(id){

await fetch("/admin/aprobar-dispositivo",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:PASS
},
body:JSON.stringify({id})
});

loadDispositivos();

}

// =========================
// BLOQUEAR
// =========================
async function bloquear(id){

await fetch("/admin/bloquear-dispositivo",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:PASS
},
body:JSON.stringify({id})
});

loadDispositivos();

}

// =========================
// AGREGAR MANUAL
// =========================
async function agregarManual(){

await fetch("/admin/agregar-dispositivo",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:PASS
},
body:JSON.stringify({
cedula:manualCedula.value,
device_id:manualDevice.value,
edificio_id:manualEdificio.value
})
});

alert("Dispositivo agregado");

loadDispositivos();

}

</script>

<!-- DISPOSITIVOS -->
<div class="modal" id="deviceBox">
<div class="card" style="
width:95%;
max-width:1000px;
min-height:500px;
">

<h3>Dispositivos</h3>

<table>
<thead>
<tr>
<th>ID</th>
<th>Nombre</th>
<th>Cédula</th>
<th>Edificio</th>
<th>Estado</th>
<th>Device ID</th>
<th>Acciones</th>
</tr>
</thead>

<tbody id="tablaDevices"></tbody>
</table>

<br>

<h3>Agregar Manual</h3>

<input id="manualCedula" placeholder="Cédula">
<input id="manualDevice" placeholder="Device ID">
<select id="manualEdificio"></select>

<button onclick="agregarManual()">
➕ Agregar Manual
</button>

<button onclick="cerrarDispositivos()" style="background:red;">
Cerrar
</button>

</div>
</div>

</body>
</html>

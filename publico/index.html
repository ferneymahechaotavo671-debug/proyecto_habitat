<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro QR</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f3d2e">
<link rel="apple-touch-icon" href="/icon-512.png">

<style>

/* ===== RESET ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* ===== FUENTE PRO ===== */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0f3d2e, #1f7a63, #38b48b);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    animation: fondoAnim 6s ease-in-out infinite alternate;
}

/* ===== ANIMACIÓN FONDO ===== */
@keyframes fondoAnim {
    0% { filter: brightness(0.95); }
    100% { filter: brightness(1.05); }
}

/* ===== CONTENEDOR ===== */
.container {
    background: rgba(255, 255, 255, 0.93);
    backdrop-filter: blur(12px);
    padding: 35px;
    border-radius: 22px;
    width: 90%;
    max-width: 420px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    text-align: center;
    animation: aparecer 0.6s ease;
}

/* ===== ANIMACIÓN ===== */
@keyframes aparecer {
    from { opacity: 0; transform: translateY(20px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

/* ===== LOGO ===== */
.logo {
    width: 110px;
    margin-bottom: 15px;
}

/* ===== TITULO ===== */
h1 {
    color: #0f3d2e;
    margin-bottom: 10px;
}

/* ===== SUBTITULO ===== */
h3 {
    color: #1f7a63;
    margin-bottom: 20px;
}

/* ===== FORM ===== */
form {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

/* ===== INPUT ===== */
input {
    padding: 13px;
    border-radius: 12px;
    border: 1px solid #ddd;
    background: #f9f9f9;
}

/* ===== BOTÓN ===== */
button {
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #1f7a63, #38b48b);
    color: white;
    cursor: pointer;
}

/* ===== MENSAJE ===== */
#mensaje {
    margin-top: 15px;
    opacity: 0;
    transition: 0.4s;
}

#mensaje.show {
    opacity: 1;
}

.success { color: #1f7a63; }
.error { color: #d93025; }

#overlayMensaje {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;

  opacity: 0;
  pointer-events: none;
  transition: 0.4s;
}

#overlayMensaje.show {
  opacity: 1;
  pointer-events: all;
}

.mensaje-box {
  background: white;
  padding: 40px;
  border-radius: 20px;
  text-align: center;
  animation: pop 0.4s ease;
}

.mensaje-box h2 {
  font-size: 28px;
  color: #1f7a63;
}

@keyframes pop {
  from {
    transform: scale(0.8);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

</style>
</head>

<body>

<div class="container">

  <img src="logo.png" class="logo">

  <h1>Registro de Ingreso / Salida</h1>

  <h3 id="edificio">Validando...</h3>

  <form id="form">
    <input type="text" id="cedula" placeholder="Ingrese su cédula" required>
    <button type="submit">Registrar</button>
  </form>

  <p id="mensaje"></p>

</div>

<div id="overlayMensaje">
  <div class="mensaje-box">
    <h2 id="textoGrande"></h2>
  </div>
</div>

<script>

// ==============================
// QR
// ==============================
const params = new URLSearchParams(location.search);
let codigo = params.get("edificio");

let modoHome = false;

// ==============================
// SI NO HAY QR → HOME
// ==============================
if (!codigo) {

  modoHome = true;

  document.body.innerHTML = `
    <div style="text-align:center; padding:30px; font-family:Arial;">
      <h1>🏢 HÁBITAT</h1>

      <p>Selecciona una opción</p>

      <button onclick="iniciarCamaraQR()" style="
        padding:12px;
        margin-top:20px;
        background:#1f7a63;
        color:white;
        border:none;
        border-radius:10px;
        width:80%;
      ">
        📷 Escanear QR
      </button>

      <button onclick="cargarEdificios()" style="
        padding:12px;
        margin-top:10px;
        background:#0f3d2e;
        color:white;
        border:none;
        border-radius:10px;
        width:80%;
      ">
        🏢 Ver edificios
      </button>

      <div id="lista"></div>

      <video id="video" style="width:100%; margin-top:20px; display:none;"></video>

    </div>
  `;
}

// ==============================
// ⏱ TIEMPO QR
// ==============================
const TIEMPO_LIMITE = 20 * 60 * 1000;

let inicioGuardado = localStorage.getItem("inicioQR");

if (!inicioGuardado) {
  inicioGuardado = Date.now();
  localStorage.setItem("inicioQR", inicioGuardado);
}

const inicio = parseInt(inicioGuardado);

function verificarTiempo() {
  const ahora = Date.now();
  if (ahora - inicio > TIEMPO_LIMITE) {
    localStorage.removeItem("inicioQR");

    document.body.innerHTML = `
      <div style="text-align:center;">
        <h2>⏰ Sesión expirada</h2>
        <p>Debes escanear nuevamente el QR</p>
      </div>
    `;
    return false;
  }
  return true;
}

if (!verificarTiempo()) throw new Error("expirado");

// ==============================
// CARGAR EDIFICIO (ARREGLADO)
// ==============================
async function cargarNombreEdificio() {

  if (modoHome) return;

  try {

    const res = await fetch("/admin/edificios", {
      headers: {
        "Authorization": localStorage.getItem("auth") || ""
      }
    });

    const data = await res.json();

    const edificio = data.find(e => e.codigo_qr === codigo);

    document.getElementById("edificio").innerText =
      edificio ? edificio.nombre : "Edificio no válido ❌";

  } catch (error) {
    document.getElementById("edificio").innerText = "Error cargando edificio";
  }
}

cargarNombreEdificio();

// ==============================
// ESCÁNER QR REAL (CÁMARA)
// ==============================
function iniciarCamaraQR() {

  const video = document.getElementById("video");
  video.style.display = "block";

  navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
    .then(stream => {

      video.srcObject = stream;
      video.play();

      const track = stream.getVideoTracks()[0];
      const imageCapture = new ImageCapture(track);

      setInterval(async () => {

        try {

          const bitmap = await imageCapture.grabFrame();
          const canvas = document.createElement("canvas");
          canvas.width = bitmap.width;
          canvas.height = bitmap.height;

          const ctx = canvas.getContext("2d");
          ctx.drawImage(bitmap, 0, 0);

          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

          // 👉 Aquí conectamos lector QR simple (placeholder)
          console.log("Escaneando QR...");

        } catch (err) {
          console.log(err);
        }

      }, 1500);

    })
    .catch(err => {
      alert("No se pudo abrir cámara ❌");
    });
}

// ==============================
// LISTA EDIFICIOS
// ==============================
async function cargarEdificios() {

  const res = await fetch("/admin/edificios", {
    headers: {
      "Authorization": localStorage.getItem("auth") || ""
    }
  });

  const data = await res.json();

  const lista = document.getElementById("lista");

  lista.innerHTML = data.map(e => `
    <div style="
      margin-top:10px;
      padding:10px;
      background:#eee;
      border-radius:10px;
    ">
      <b>${e.nombre}</b><br>
      <small>${e.codigo_qr}</small>
    </div>
  `).join("");
}

// ==============================
// REGISTRO
// ==============================
document.getElementById("form").onsubmit = async (e) => {

  e.preventDefault();

  if (!verificarTiempo()) return;

  const cedula = document.getElementById("cedula").value.trim();

  try {

    const res = await fetch("/registro", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        cedula,
        codigoEdificio: codigo
      })
    });

    const data = await res.json();

    mostrarMensajeGrande(data.mensaje, "ok");

  } catch (err) {
    mostrarMensajeGrande("Error de conexión ❌", "error");
  }
};

</script>

</body>
</html>

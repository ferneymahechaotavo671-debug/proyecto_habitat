<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro QR</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
font-family:Arial;
background:linear-gradient(135deg,#0f3d2e,#1f7a63,#38b48b);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
background:white;
padding:25px;
border-radius:15px;
width:90%;
max-width:400px;
text-align:center;
}

input,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:1px solid #ddd;
}

button{
background:#1f7a63;
color:white;
border:none;
}
</style>
</head>

<body>

<div class="container">

<h2>Registro QR</h2>

<h3 id="edificio">Validando...</h3>

<form id="form">
<input id="cedula" placeholder="Cédula" required>
<button>Registrar</button>
</form>

<button onclick="camara()">Escanear QR</button>

<div id="reader"></div>

</div>

<script>

const params=new URLSearchParams(location.search);
let codigo=params.get("edificio");

function limpiar(t){
return (t||"")
.toLowerCase()
.replace(/\s+/g,"")
.replace(/[^a-z0-9]/g,"");
}

/* EDIFICIO */
async function cargar(){

if(!codigo) return;

const r=await fetch("/admin/edificios");
const d=await r.json();

const ed=d.find(e=>limpiar(e.codigo_qr)==limpiar(codigo));

edificio.innerText=ed?ed.nombre:"Inválido ❌";
}

cargar();

/* DEVICE */
function device(){
let id=localStorage.getItem("id");
if(!id){
id=crypto.randomUUID();
localStorage.setItem("id",id);
}
return id;
}

/* REGISTRO */
form.onsubmit=async(e)=>{
e.preventDefault();

const r=await fetch("/registro",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
cedula:cedula.value,
codigoEdificio:codigo,
deviceId:device()
})
});

const d=await r.json();
alert(d.mensaje);
};

/* QR */
function camara(){

const scan=new Html5Qrcode("reader");

Html5Qrcode.getCameras().then(devs=>{

scan.start(devs[0].id,{fps:10,qrbox:250},
(text)=>{

scan.stop();

let clean=text
.replace(/.*edificio=/,"")
.replace(/[^a-z0-9]/g,"");

location.href="/?edificio="+clean;

});

});

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro QR</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f3d2e">
<link rel="apple-touch-icon" href="/icon-512.png">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#0f3d2e,#1f7a63,#38b48b);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.container{
background:rgba(255,255,255,0.93);
padding:35px;
border-radius:22px;
width:90%;
max-width:420px;
text-align:center;
}

input{
padding:13px;
width:100%;
margin-top:10px;
border-radius:12px;
border:1px solid #ddd;
}

button{
padding:13px;
width:100%;
margin-top:10px;
border:none;
border-radius:12px;
background:#1f7a63;
color:white;
}

#reader{
margin-top:15px;
}

#overlayMensaje{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.7);
display:flex;
justify-content:center;
align-items:center;
opacity:0;
pointer-events:none;
transition:0.4s;
}

#overlayMensaje.show{
opacity:1;
pointer-events:all;
}

.mensaje-box{
background:white;
padding:30px;
border-radius:20px;
}

</style>
</head>

<body>

<div class="container">

  <img src="logo.png" width="100">

  <h2>Registro QR</h2>

  <h3 id="edificio">Validando...</h3>

  <form id="form">
    <input id="cedula" placeholder="Cédula" required>
    <button>Registrar</button>
  </form>

  <button onclick="iniciarCamaraQR()">📷 Escanear QR</button>

  <div id="reader"></div>

</div>

<div id="overlayMensaje">
  <div class="mensaje-box">
    <h2 id="textoGrande"></h2>
  </div>
</div>

<script>

// =========================
// 🔐 DEVICE ID (ANTI-SUPLANTACIÓN)
// =========================
function getDeviceId(){
  let id = localStorage.getItem("device_id");

  if(!id){
    id = crypto.randomUUID();
    localStorage.setItem("device_id", id);
  }

  return id;
}

// =========================
// QR
// =========================
const params = new URLSearchParams(location.search);
let codigo = params.get("edificio");

// =========================
// TIEMPO QR
// =========================
const LIMITE = 20 * 60 * 1000;

let inicio = localStorage.getItem("inicioQR");

if(!inicio){
  inicio = Date.now();
  localStorage.setItem("inicioQR", inicio);
}

function verificar(){
  if(Date.now() - inicio > LIMITE){
    document.body.innerHTML = "<h2>QR expirado</h2>";
    return false;
  }
  return true;
}

if(!verificar()) throw new Error();

// =========================
// CARGAR EDIFICIO
// =========================
async function cargarEdificio(){

  if(!codigo) return;

  const res = await fetch("/admin/edificios", {
    headers:{
      "Authorization": localStorage.getItem("auth") || ""
    }
  });

  const data = await res.json();

  const ed = data.find(e => e.codigo_qr === codigo);

  document.getElementById("edificio").innerText =
    ed ? ed.nombre : "Edificio inválido";
}

cargarEdificio();

// =========================
// QR CAMERA
// =========================
function iniciarCamaraQR(){

  const scanner = new Html5Qrcode("reader");

  Html5Qrcode.getCameras().then(devices=>{

    const cam = devices[0].id;

    scanner.start(
      cam,
      { fps:10, qrbox:250 },
      (text)=>{

        scanner.stop();

        window.location.href = `/?edificio=${text}`;

      }
    );

  });
}

// =========================
// REGISTRO + ANTI-SUPLANTACIÓN
// =========================
app.post("/registro", (req, res) => {

  let cedula = req.body.cedula?.toString().trim();
  let codigoEdificio = req.body.codigoEdificio
    ?.toString()
    .trim()
    .toLowerCase()
    .replace(/\s+/g, "")
    .replace(/\./g, "")
    .replace(/[^a-z0-9]/g, "");

  let deviceId = req.body.deviceId;

  if (!cedula || !codigoEdificio || !deviceId) {
    return res.status(400).json({ mensaje: "Datos incompletos ❌" });
  }

  // =========================
  // 1. VALIDAR EDIFICIO
  // =========================
  db.query(
    `SELECT * FROM edificios WHERE codigo_qr = ?`,
    [codigoEdificio],
    (err, eds) => {

      if (err) return res.status(500).json({ mensaje: "Error servidor ❌" });

      if (eds.length === 0) {
        return res.json({ mensaje: "QR inválido ❌" });
      }

      const edificio = eds[0];

      // =========================
      // 2. VALIDAR USUARIO
      // =========================
      db.query(
        `SELECT u.id, u.nombre, r.nombre AS rol
         FROM usuarios u
         JOIN roles r ON u.rol_id = r.id
         WHERE u.cedula = ?`,
        [cedula],
        (err, users) => {

          if (err) return res.status(500).json({ mensaje: "Error servidor ❌" });

          if (users.length === 0) {
            return res.json({ mensaje: "Usuario no existe ❌" });
          }

          const user = users[0];

          // =========================
          // 3. VALIDAR DISPOSITIVO
          // =========================
          db.query(
            `SELECT * FROM dispositivos 
             WHERE cedula=? AND edificio_id=?`,
            [cedula, edificio.id],
            (err, devices) => {

              if (err) return res.status(500).json({ mensaje: "Error servidor ❌" });

              // 👉 SI YA EXISTE REGISTRO
              if (devices.length > 0) {

                const savedDevice = devices[0].device_id;

                // 🚨 SUPLANTACIÓN DETECTADA
                if (savedDevice !== deviceId) {

                  // log de seguridad
                  console.log("🚨 INTENTO DE SUPLANTACIÓN:", {
                    cedula,
                    deviceId,
                    savedDevice
                  });

                  return res.status(403).json({
                    mensaje: "🚫 Dispositivo no autorizado"
                  });
                }
              }

              // =========================
              // 4. REGISTRAR DISPOSITIVO SI ES NUEVO
              // =========================
              if (devices.length === 0) {

                db.query(
                  `INSERT INTO dispositivos (cedula, device_id, edificio_id)
                   VALUES (?, ?, ?)`,
                  [cedula, deviceId, edificio.id]
                );
              }

              // =========================
              // 5. LÓGICA DE REGISTRO
              // =========================
              db.query(
                `SELECT *
                 FROM registros
                 WHERE cedula=? AND edificio_id=?
                 ORDER BY fecha_hora DESC
                 LIMIT 1`,
                [cedula, edificio.id],
                (err, last) => {

                  if (err) return res.status(500).json({ mensaje: "Error servidor ❌" });

                  let tipo = "Entrada";

                  if (last.length > 0) {
                    tipo = last[0].tipo_registro === "Entrada" ? "Salida" : "Entrada";
                  }

                  // =========================
                  // 6. INSERT REGISTRO
                  // =========================
                  db.query(
                    `INSERT INTO registros
                    (nombre, cedula, edificio, tipo_registro, edificio_id, rol)
                    VALUES (?, ?, ?, ?, ?, ?)`,
                    [
                      user.nombre,
                      cedula,
                      edificio.nombre,
                      tipo,
                      edificio.id,
                      user.rol
                    ],
                    (err) => {

                      if (err) {
                        return res.status(500).json({ mensaje: "Error registro ❌" });
                      }

                      return res.json({
                        mensaje: `${tipo} registrada ✅`,
                        seguridad: "OK"
                      });
                    }
                  );
                }
              );
            }
          );
        }
      );
    }
  );
});

</script>

</body>
</html>

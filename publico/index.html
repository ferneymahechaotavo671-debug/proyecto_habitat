<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro QR</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f3d2e">
<link rel="apple-touch-icon" href="/icon-512.png">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#0f3d2e,#1f7a63,#38b48b);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.container{
background:rgba(255,255,255,0.93);
padding:35px;
border-radius:22px;
width:90%;
max-width:420px;
text-align:center;
}

input{
padding:13px;
width:100%;
margin-top:10px;
border-radius:12px;
border:1px solid #ddd;
}

button{
padding:13px;
width:100%;
margin-top:10px;
border:none;
border-radius:12px;
background:#1f7a63;
color:white;
}

#reader{
margin-top:15px;
}

#overlayMensaje{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.7);
display:flex;
justify-content:center;
align-items:center;
opacity:0;
pointer-events:none;
transition:0.4s;
}

#overlayMensaje.show{
opacity:1;
pointer-events:all;
}

.mensaje-box{
background:white;
padding:30px;
border-radius:20px;
}

</style>
</head>

<body>

<div class="container">

  <img src="logo.png" width="100">

  <h2>Registro QR</h2>

  <h3 id="edificio">Validando...</h3>

  <form id="form">
    <input id="cedula" placeholder="Cédula" required>
    <button>Registrar</button>
  </form>

  <button onclick="iniciarCamaraQR()">📷 Escanear QR</button>

  <div id="reader"></div>

</div>

<div id="overlayMensaje">
  <div class="mensaje-box">
    <h2 id="textoGrande"></h2>
  </div>
</div>

<script src="https://unpkg.com/html5-qrcode"></script>

<script>

// =========================
// 📌 PARAMS QR
// =========================
const params = new URLSearchParams(window.location.search);
const codigo = params.get("edificio");

let modoHome = !codigo;

// =========================
// 🔐 DEVICE ID (ANTI-SUPLANTACIÓN BASE)
// =========================
function getDeviceId(){
  let id = localStorage.getItem("device_id");

  if(!id){
    id = crypto.randomUUID();
    localStorage.setItem("device_id", id);
  }

  return id;
}

// =========================
// ⏱ CONTROL QR
// =========================
function verificarTiempo(){

  const LIMITE = 20 * 60 * 1000;
  const inicio = Number(localStorage.getItem("inicioQR"));

  if(!inicio) return true;

  if(Date.now() - inicio > LIMITE){

    localStorage.removeItem("inicioQR");

    document.body.innerHTML = `
      <div style="text-align:center;font-family:Arial;">
        <h2>⏰ QR expirado</h2>
        <p>Vuelve a escanear el código</p>
      </div>
    `;

    return false;
  }

  return true;
}

// activar solo si hay QR
if(codigo){
  if(!localStorage.getItem("inicioQR")){
    localStorage.setItem("inicioQR", Date.now());
  }

  if(!verificarTiempo()) throw new Error("QR expirado");
}

// =========================
// 🏠 HOME MODE
// =========================
if(modoHome){

  document.body.innerHTML = `
    <div style="text-align:center;padding:30px;font-family:Arial;">
      <h1>🏢 HÁBITAT</h1>

      <button onclick="iniciarCamaraQR()" style="
        padding:12px;
        margin-top:20px;
        background:#1f7a63;
        color:white;
        border:none;
        border-radius:10px;
        width:80%;
      ">
        📷 Escanear QR
      </button>

      <div id="reader" style="margin-top:20px;"></div>
    </div>
  `;

  setTimeout(mostrarBotonInstalar, 300);
}

// =========================
// 📲 PWA INSTALL BUTTON
// =========================
let deferredPrompt;

function mostrarBotonInstalar(){

  const btn = document.createElement("button");

  btn.innerText = "📲 Instalar App";

  Object.assign(btn.style, {
    position: "fixed",
    bottom: "20px",
    right: "20px",
    padding: "12px",
    background: "#1f7a63",
    color: "white",
    border: "none",
    borderRadius: "10px",
    zIndex: 9999
  });

  document.body.appendChild(btn);

  btn.onclick = async () => {

    if(!deferredPrompt){
      alert("Instalación no disponible");
      return;
    }

    deferredPrompt.prompt();
    await deferredPrompt.userChoice;

    deferredPrompt = null;
    btn.remove();
  };
}

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;

  mostrarBotonInstalar();
});

// =========================
// 📷 ESCÁNER QR REAL
// =========================
function iniciarCamaraQR(){

  const scanner = new Html5Qrcode("reader");

  Html5Qrcode.getCameras().then(devices => {

    const cam = devices[0].id;

    scanner.start(
      cam,
      { fps: 10, qrbox: 250 },
      (text) => {

        scanner.stop();

        window.location.href = `/?edificio=${text}`;

      }
    );

  }).catch(err => {
    alert("Error cámara ❌");
    console.error(err);
  });
}

// =========================
// 🏢 CARGAR EDIFICIO
// =========================
async function cargarEdificio(){

  if(!codigo) return;

  try {

    const res = await fetch("/admin/edificios", {
      headers: {
        "Authorization": localStorage.getItem("auth") || ""
      }
    });

    const data = await res.json();

    const ed = data.find(e => e.codigo_qr === codigo);

    const el = document.getElementById("edificio");
    if(el){
      el.innerText = ed ? ed.nombre : "Edificio inválido";
    }

  } catch (e) {
    console.log("Error edificio", e);
  }
}

cargarEdificio();

</script>

</body>
</html>

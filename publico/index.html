<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro QR</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f3d2e">
<link rel="apple-touch-icon" href="/icon-512.png">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#0f3d2e,#1f7a63,#38b48b);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.container{
background:rgba(255,255,255,0.95);
padding:30px;
border-radius:20px;
width:92%;
max-width:420px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.25);
}

h2{color:#0f3d2e;margin-bottom:10px}
h3{color:#1f7a63;margin-bottom:15px}

input{
padding:13px;
width:100%;
margin-top:10px;
border-radius:12px;
border:1px solid #ddd;
font-size:16px;
}

button{
padding:13px;
width:100%;
margin-top:10px;
border:none;
border-radius:12px;
background:#1f7a63;
color:white;
font-size:16px;
}

#reader{
margin-top:15px;
border-radius:12px;
overflow:hidden;
}

#overlayMensaje{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.7);
display:flex;
justify-content:center;
align-items:center;
opacity:0;
pointer-events:none;
transition:0.3s;
}

#overlayMensaje.show{
opacity:1;
pointer-events:all;
}

.mensaje-box{
background:white;
padding:30px;
border-radius:15px;
text-align:center;
}

</style>
</head>

<body>

<div class="container">

  <img src="logo.png" width="90">

  <h2>Registro QR</h2>

  <h3 id="edificio">Validando...</h3>

  <form id="form">
    <input id="cedula" placeholder="Cédula" required>
    <button>Registrar</button>
  </form>

  <button onclick="iniciarCamaraQR()">📷 Escanear QR</button>

  <div id="reader"></div>

</div>

<div id="overlayMensaje">
  <div class="mensaje-box">
    <h2 id="textoGrande"></h2>
  </div>
</div>

<script>

// =========================
// QR PARAM
// =========================
const params = new URLSearchParams(location.search);

let codigo = params.get("edificio");

if (codigo) {
  codigo = codigo
    .toLowerCase()
    .trim()
    .replace(/\s+/g, "")
    .replace(/[^a-z0-9]/g, "");
}

// =========================
// DEVICE ID (LISTO ANTI-SUPLANTACIÓN)
// =========================
function getDeviceId(){
  let id = localStorage.getItem("device_id");
  if(!id){
    id = crypto.randomUUID();
    localStorage.setItem("device_id", id);
  }
  return id;
}

// =========================
// TIEMPO QR
// =========================
const LIMITE = 20 * 60 * 1000;

let codigoActual = codigo; // QR actual
let inicio = localStorage.getItem("inicioQR");
let codigoGuardado = localStorage.getItem("codigoQR");

function reiniciarTiempo() {
  localStorage.setItem("inicioQR", Date.now());
  localStorage.setItem("codigoQR", codigoActual);
}

// 👉 SI NO HAY TIEMPO O ES OTRO QR → reinicia
if (!inicio || codigoGuardado !== codigoActual) {
  reiniciarTiempo();
  inicio = localStorage.getItem("inicioQR");
}

// =============================
// VERIFICAR TIEMPO
// =============================
function verificarTiempo() {
  const start = Number(localStorage.getItem("inicioQR"));

  if (Date.now() - start > LIMITE) {

    localStorage.removeItem("inicioQR");
    localStorage.removeItem("codigoQR");

    document.body.innerHTML = `
      <div style="text-align:center;font-family:Arial;">
        <h2>⏰ QR expirado</h2>
        <p>Vuelve a escanear el código</p>
      </div>
    `;

    return false;
  }

  return true;
}

// solo validar si hay QR
if (codigo && !verificarTiempo()) throw new Error("expirado");

// =========================
// CARGAR EDIFICIO (SEGURO)
// =========================
async function cargarEdificio(){

  if(!codigo) return;

  try{

    const res = await fetch("/admin/edificios", {
      headers:{
        "Authorization": localStorage.getItem("auth") || ""
      }
    });

    const data = await res.json();

    const ed = data.find(e => e.codigo_qr === codigo);

    document.getElementById("edificio").innerText =
      ed ? ed.nombre : "Edificio inválido";

  }catch(e){
    document.getElementById("edificio").innerText = "Error";
  }
}

cargarEdificio();

// =========================
// CÁMARA (FORZAR TRASERA)
// =========================
function iniciarCamaraQR(){

  const scanner = new Html5Qrcode("reader");

  Html5Qrcode.getCameras().then(devices => {

    let backCamera =
      devices.find(d =>
        d.label.toLowerCase().includes("back") ||
        d.label.toLowerCase().includes("rear")
      );

    const cam = backCamera ? backCamera.id : devices[0].id;

    scanner.start(
      cam,
      { fps: 10, qrbox: 250 },
      (text) => {

        scanner.stop();

        window.location.href = `/?edificio=${text}`;

      }
    );

  }).catch(err => {
    alert("No se pudo abrir cámara");
    console.error(err);
  });
}

// =========================
// REGISTRO
// =========================
document.getElementById("form").addEventListener("submit", async (e)=>{

  e.preventDefault();

  const cedula = document.getElementById("cedula").value;

  const res = await fetch("/registro",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      cedula,
      codigoEdificio: codigo,
      deviceId: getDeviceId()
    })
  });

  const data = await res.json();

  document.getElementById("textoGrande").innerText = data.mensaje;
  document.getElementById("overlayMensaje").classList.add("show");

  setTimeout(()=>{
    document.getElementById("overlayMensaje").classList.remove("show");
  },2500);

});

// =========================
// PWA INSTALL BUTTON
// =========================
let deferredPrompt;

window.addEventListener("beforeinstallprompt", (e)=>{
  e.preventDefault();
  deferredPrompt = e;

  const btn = document.createElement("button");
  btn.innerText = "📲 Instalar App";

  Object.assign(btn.style,{
    position:"fixed",
    bottom:"20px",
    right:"20px",
    padding:"12px",
    background:"#1f7a63",
    color:"white",
    border:"none",
    borderRadius:"10px",
    zIndex:9999
  });

  document.body.appendChild(btn);

  btn.onclick = async ()=>{
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    btn.remove();
  };
});

</script>

</body>
</html>
